<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap');
    </style>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF9F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5E6F5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#62017F;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#ED155D;stop-opacity:0.08" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#purpleAccent)"/>

  <!-- Left content -->
  <g>
    <!-- Eyebrow -->
    <text x="80" y="110" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="3" text-transform="uppercase" fill="#62017F" opacity="0.7">
      VAGIN Initiative
    </text>

    <!-- Main headline -->
    <text x="80" y="190" font-family="'Cormorant Garamond', serif" font-size="72" font-weight="400" font-style="italic" fill="#62017F" letter-spacing="-1">
      Empower
    </text>
    <text x="80" y="270" font-family="'Cormorant Garamond', serif" font-size="72" font-weight="400" font-style="italic" fill="#ED155D" letter-spacing="-1">
      Educate
    </text>

    <!-- Subtitle -->
    <text x="80" y="330" font-family="'DM Sans', sans-serif" font-size="18" font-weight="400" fill="#0A0A0A" opacity="0.75">
      Girls' health education & leadership
    </text>
    <text x="80" y="360" font-family="'DM Sans', sans-serif" font-size="18" font-weight="400" fill="#0A0A0A" opacity="0.75">
      program for young women.
    </text>

    <!-- Impact indicator -->
    <text x="80" y="430" font-family="'Cormorant Garamond', serif" font-size="28" font-weight="600" fill="#62017F">
      Building Futures
    </text>
  </g>

  <!-- Right: Empowerment visualization -->
  <g transform="translate(900, 315)">
    <!-- Rising bars suggesting growth/empowerment -->
    <rect x="-70" y="40" width="20" height="60" fill="#ED155D" opacity="0.4" rx="4"/>
    <rect x="-35" y="20" width="20" height="80" fill="#ED155D" opacity="0.6" rx="4"/>
    <rect x="0" y="0" width="20" height="100" fill="#62017F" rx="4"/>
    <rect x="35" y="20" width="20" height="80" fill="#ED155D" opacity="0.6" rx="4"/>
    <rect x="70" y="40" width="20" height="60" fill="#ED155D" opacity="0.4" rx="4"/>

    <!-- Connecting line -->
    <line x1="-70" y1="100" x2="90" y2="100" stroke="#62017F" stroke-width="2" opacity="0.3"/>

    <!-- Center accent -->
    <circle cx="10" cy="-40" r="6" fill="#ED155D"/>
  </g>
</svg>
